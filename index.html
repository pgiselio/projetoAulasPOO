<!DOCTYPE html>
<html lang="pt-BR">

<head>
  <meta charset="UTF-8" />
  <!-- <link rel="stylesheet" href="./css/bootstrap.min.css"> -->
  <link rel="stylesheet" href="./styles.css" />
  <link rel="stylesheet" href="./tabStyle.css" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="Turma.js" defer></script>
  <script src="Aluno.js" defer></script>
  <script src="Interface.js" defer></script>

  <script src="main.js" defer></script>
  <title>Sistema Escolar</title>

  <link href="./fontAwesome/css/fontawesome.css" rel="stylesheet" />
  <link href="./fontAwesome/css/brands.css" rel="stylesheet" />
  <link href="./fontAwesome/css/solid.css" rel="stylesheet" />
</head>

<body>
  <!-- Botões para trocar de aba -->

  <div class="container">
    

    <div class="turma">

      <div class="tabs-container">
        <button class="tab-button active" id="btn-cadastrar" onclick="Interface.cadastrar()">
          Cadastrar
        </button>
        <button class="tab-button" id="btn-listar" onclick="listarAluno()">
          Listar Alunos
        </button>
      </div>

      <!-- Conteúdo da Aba 1: Cadastrar -->
      <form id="tab-cadastrar-aluno" class="tab-content active">
        <label for="nome">Nome: </label>
        <input id="nome" type="text" />
        <label for="n1"> Nota 1:</label>
        <input id="n1" type="text" />
        <label for="n2">Nota 2:</label>
        <input id="n2" type="text" />
        <label for="n3">Nota 3:</label>
        <input id="n3" type="text" />
        <button type="submit" class="btn-salvar">Salvar Aluno</button>
      </form>

      <div>
        <h3>Alunos Cadastrados</h3>
        <div class="lista-alunos table-responsive" id="alunos">
          <table>
            <thead>
              <tr>
                <th scope="col">Nome</th>
                <th scope="col" class="col-nota">N1</th>
                <th scope="col" class="col-nota">N2</th>
                <th scope="col" class="col-nota">N3</th>
                <th scope="col" class="col-nota">Media</th>
                <th scope="col" class="col-situacao">Situação</th>
              </tr>
            </thead>
            <tbody>
              <tr>
                <td colspan="6" align="center">Nenhum aluno cadastrado.</td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
